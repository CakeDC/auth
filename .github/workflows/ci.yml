# CI workflow adapted from https://github.com/cakephp/cakephp/blob/master/.github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testsuite:
    # Pull requests from branches of this repository are already tested by the push event
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        db-type: [sqlite, mysql, pgsql]
        dependencies: [highest]
        include:
          - php-version: '8.2'
            db-type: sqlite
            dependencies: lowest

    name: PHP ${{ matrix.php-version }}, ${{ matrix.db-type }}, ${{ matrix.dependencies }} dependencies

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MySQL
        if: matrix.db-type == 'mysql'
        run: |
          sudo service mysql start
          mysql -h 127.0.0.1 -u root -proot -e 'CREATE DATABASE cakephp;'

      - name: Setup PostgreSQL
        if: matrix.db-type == 'pgsql'
        run: docker run --rm --name=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=cakephp -p 5432:5432 -d postgres

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_${{ matrix.db-type }}
          coverage: none

      - name: Composer install
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --prefer-stable

      - name: Setup problem matchers for PHPUnit
        if: matrix.php-version == '8.2' && matrix.db-type == 'mysql'
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run PHPUnit
        run: |
          if [[ ${{ matrix.db-type }} == 'sqlite' ]]; then export DB_URL='sqlite:///:memory:'; fi
          if [[ ${{ matrix.db-type }} == 'mysql' ]]; then export DB_URL='mysql://root:root@127.0.0.1/cakephp?encoding=utf8'; fi
          if [[ ${{ matrix.db-type }} == 'pgsql' ]]; then export DB_URL='postgres://postgres:postgres@127.0.0.1/postgres'; fi
          vendor/bin/phpunit

      # Codecov is disabled: uploads need a CODECOV_TOKEN secret. To enable it, set `coverage: pcov`
      # for PHP 8.2, run `vendor/bin/phpunit --coverage-clover=coverage.xml` and uncomment this step.
      # - name: Submit code coverage
      #   if: matrix.php-version == '8.2' && matrix.db-type == 'sqlite' && matrix.dependencies == 'highest'
      #   uses: codecov/codecov-action@v5
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: coverage.xml
      #     fail_ci_if_error: true

  cs-stan:
    name: Coding Standard & Static Analysis
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl
          coverage: none

      - name: Composer install
        uses: ramsey/composer-install@v3

      - name: Run PHP CodeSniffer
        run: composer cs-check

      - name: Run psalm
        if: success() || failure()
        run: composer psalm

      - name: Run phpstan
        if: success() || failure()
        run: composer stan
